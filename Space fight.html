<!DOCTYPE html>
<!-- Created with https://packager.turbowarp.org/ -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- We only include this to explicitly loosen the CSP of various packager environments. It does not provide any security. -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Space fight</title>
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #000000;
    }
    :root, body.is-fullscreen {
      background-color: #000000;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
      z-index: 10;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    
    /* Mobile On-Screen Controls Styling */
    #mobile-controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 999;
      pointer-events: none; /* Let clicks pass through empty spaces */
    }
    .control-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
      touch-action: manipulation;
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(255, 255, 255, 0.6);
    }
  </style>
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div id="app"></div>

  <!-- On-Screen Mobile Controls -->
  <div id="mobile-controls">
    <div class="control-group">
      <button class="touch-btn" id="btn-left">←</button>
      <button class="touch-btn" id="btn-right">→</button>
    </div>
    <div class="control-group">
      <button class="touch-btn" id="btn-space">!</button>
    </div>
  </div>

  <div id="launch" class="screen" title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#4cbf56;stroke:#45993d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <!-- Keep your original TurboWarp JavaScript scaffolding script here -->
  <script>
    /* [Your original TurboWarp Webpack script remains unchanged here] */
  </script>

  <!-- Script to Map Touch/Mouse Actions to Keyboard Events -->
  <script>
    function simulateKeyEvent(key, code, keyCode, type) {
      const event = new KeyboardEvent(type, {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      });
      document.dispatchEvent(event);
    }

    function bindTouchButton(elementId, key, code, keyCode) {
      const btn = document.getElementById(elementId);
      if (!btn) return;

      const press = (e) => {
        e.preventDefault();
        btn.classList.add('active');
        simulateKeyEvent(key, code, keyCode, 'keydown');
      };

      const release = (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        simulateKeyEvent(key, code, keyCode, 'keyup');
      };

      btn.addEventListener('touchstart', press, {passive: false});
      btn.addEventListener('touchend', release, {passive: false});
      btn.addEventListener('touchcancel', release, {passive: false});
      
      // Fallback for mouse testing on PC
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    }

    // Map buttons to standard Scratch controls (Left Arrow, Right Arrow, Spacebar)
    window.addEventListener('DOMContentLoaded', () => {
      bindTouchButton('btn-left', 'ArrowLeft', 'ArrowLeft', 37);
      bindTouchButton('btn-right', 'ArrowRight', 'ArrowRight', 39);
      bindTouchButton('btn-space', ' ', 'Space', 32);
    });
  </script>
</body>
</html>
