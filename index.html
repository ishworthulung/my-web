    <script>
        function sendKey(keyCode, type="keydown") { 
            let event = new KeyboardEvent(type, { 
                keyCode: keyCode, which: keyCode }); 
                document.querySelector("iframe").contentWindow.document.dispatchEvent(event);
                
                } 
                document.getElementById("left").addEventListener("touchstart", () => sendKey(37));
                document.getElementById("left").addEventListener("touchend", () => sendKey(37,"keyup")); 
                
                document.getElementById("right").addEventListener("touchstart", () => sendKey(39)); 
                document.getElementById("right").addEventListener("touchend", () => sendKey(39,"keyup")); 
                
                document.getElementById("space").addEventListener("touchstart", () => sendKey(32));
                document.getElementById("space").addEventListener("touchend", () => sendKey(32,"keyup")); 
                
                document.getElementById("up").addEventListener("touchstart", () => sendKey(38)); 
                document.getElementById("up").addEventListener("touchend", () => sendKey(38,"keyup"));
                
                document.getElementById("down").addEventListener("touchstart", () => sendKey(40)); 
                document.getElementById("down").addEventListener("touchend", () => send

                
                </script>
    </script>
