

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConttrolSachin</title>
</head>
<html>
<head>
  <title>ESP8266 Firebase Control</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body{
      background-color: black;
      color: white;
      justify-content: center;
      justify-self: center;
      justify-items: center;
      text-align: center;
      width: 100%;
      height: 100%;
    }
    button{
      background-color: black;
      color: white;
      height: 10pc;
      width: 10pc;
      border-radius: 50%;
    }
    #red_on{
      box-shadow: -5px 10px 5px green;

    }
    #green_on{
      box-shadow: -5px 10px 5px green;
    }
    #controls{
      justify-content: center;
      justify-items: center;
      width: 50%;
      height: auto;
      display: none;
    }
  </style>

</head>
<body>
  <h2>Control My Devices</h2>
  <div id="passkey">
    <p id="passkey_test"></p>
    <label for="input">Passkey: </label>
    <input type="password" 
      inputmode="numeric" 
       pattern="[0-9]*" 
       oninput="this.value=this.value.replace(/[^0-9]/g,'');">
    <input type="button" onclick="checkPasskey()" value="Submit"></input>
  </div>
  <div id="controls">
    <label>Time: </label>
    <label id="seconds"></label><br><br>
  <label>Fan Speed: </label>
  <input onchange="setFan()" type="range" id="fanInput" min="0" max="100" value="0"> 
  <!-- <button onclick="setFan()">Set Fan</button> -->
  <br><br>

  <button id="red_on" onclick="setRed(false)">Red ON</button>
  <button id="red_off" onclick="setRed(true)">Red OFF</button>
  <br><br>

  <button id="green_on" onclick="setGreen(false)">Green ON</button>
  <button id="green_off" onclick="setGreen(true)">Green OFF</button>

  </div>
  <p style="font-style: italic; bottom: 100px;">© Made by me Ishwor as you know Sachin</p>
  
</body>

  <script src="control_server.js"></script>
    

</html>
